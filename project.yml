# XcodeGen 工程描述。CI 在 macOS 上用它生成 .xcodeproj —— 不要手写或提交 .xcodeproj。
# ${VAR} 来自 app.env（CI 会 source 进环境变量）和 GitHub Secrets。
name: ${APP_NAME}
options:
  bundleIdPrefix: com.deffisoan
  deploymentTarget:
    iOS: ${IOS_DEPLOYMENT_TARGET}
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: ${MARKETING_VERSION}
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    info:
      path: App/Info.plist   # 由 XcodeGen 生成，已 gitignore
      properties:
        CFBundleDisplayName: ${DISPLAY_NAME}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false   # 免去每次上传的出口合规问答
        LSRequiresIPhoneOS: true
    settings:
      base:
        PRODUCT_NAME: ${APP_NAME}
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Release 直接用分发证书签名：App Store 描述文件不需要注册测试设备
        # （否则自动签名会先要 Development 描述文件，报 "Your team has no devices"）
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
schemes:
  App:
    build:
      targets:
        App: all
    archive:
      config: Release
