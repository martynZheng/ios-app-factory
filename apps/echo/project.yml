# XcodeGen：iOS App + 内嵌的 watchOS App（单目标 Watch App）。${VAR} 来自 app.env 和 GitHub Secrets。
name: ${APP_NAME}
options:
  bundleIdPrefix: com.deffisoan
  deploymentTarget:
    iOS: ${IOS_DEPLOYMENT_TARGET}
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: ${MARKETING_VERSION}
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes:
          - "pi-agent.jsbundle"
      # 打包好的 Pi 智能体内核（JavaScript），作为资源随 App 带上，运行时由 JavaScriptCore 加载
      - path: App/Resources/pi-agent.jsbundle
        buildPhase: resources
      - path: Shared
    dependencies:
      - target: WatchApp
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ${DISPLAY_NAME}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSSpeechRecognitionUsageDescription: 拾言在本机把你主动录下的对话转写成文字，用于回顾、摘要和待办。
        NSRemindersFullAccessUsageDescription: 让助理查看、新建、勾掉你的提醒事项；删除前会先问你。
        NSCalendarsWriteOnlyAccessUsageDescription: 把待办和你让助理安排的事写入日历。
        NSFaceIDUsageDescription: 用面容 ID 保护你的对话记录。
        UIAppFonts: [InkSerif.otf]
        NSCameraUsageDescription: 拍一张照片发给助理，让它识别上面的文字或内容。
        NSMicrophoneUsageDescription: 只有在你点对话页的麦克风后才会录音，用来把你说的话转成文字发给助理；录音时界面会一直显示计时。
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.deffisoan.echo.refresh, com.deffisoan.echo.dream]
        NSLocationWhenInUseUsageDescription: 记录你到访过的地点，用来判断每段对话发生在哪里（会议室、路上、家里）。只存在本机。
        NSLocationAlwaysAndWhenInUseUsageDescription: 在后台用系统的到访检测记录你去过的地点（很省电），这样不打开 App 也能知道每段录音发生在哪。只存在本机。
        NSMotionUsageDescription: 读取 iPhone 记录的运动状态（静止、步行、乘车），用来判断你录音时在做什么。只存在本机。
        NSHealthShareUsageDescription: 让助理读取你的步数、睡眠、心率、体能训练等健康数据，回答你的问题、结合你的状态给建议。数据只在回答你时发给你配置的云端模型，不会写入“健康”。
        NSHealthUpdateUsageDescription: 拾言不会写入健康数据。
        NSContactsUsageDescription: 让助理在通讯录里查人：电话、邮箱、生日、公司，只在回答你时把查到的那几条发给云端模型。
        CFBundleURLTypes:
          - CFBundleURLName: com.deffisoan.echo.callback
            CFBundleURLSchemes: [shiyan-echo]
        LSApplicationQueriesSchemes: [shortcuts, weixin, alipay, iosamap, baidumap, comgooglemaps]
        NSCalendarsFullAccessUsageDescription: 让助理查看和安排你的日程，并判断每段录音是在哪个会议或活动里；删除日程前会先问你。
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_NAME: ${APP_NAME}
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  WatchApp:
    type: application
    platform: watchOS
    sources:
      - path: Watch/Sources
      - path: Watch/Resources
      - path: Shared
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: ${DISPLAY_NAME}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: ${BUNDLE_ID}
        # 公开的后台音频模式：前台由用户开始录音后，转入后台仍可继续，系统会显示麦克风指示
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: 只有在你点「开始录音」后才会录音，录音期间手表会显示系统麦克风指示。
    settings:
      base:
        PRODUCT_NAME: ${APP_NAME}Watch
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
schemes:
  App:
    build:
      targets:
        App: all
    archive:
      config: Release
