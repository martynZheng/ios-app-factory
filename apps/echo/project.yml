# XcodeGen：iOS App + 内嵌的 watchOS App（单目标 Watch App）。${VAR} 来自 app.env 和 GitHub Secrets。
name: ${APP_NAME}
options:
  bundleIdPrefix: com.deffisoan
  deploymentTarget:
    iOS: ${IOS_DEPLOYMENT_TARGET}
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: ${MARKETING_VERSION}
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Shared
    dependencies:
      - target: WatchApp
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ${DISPLAY_NAME}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSSpeechRecognitionUsageDescription: 拾言在本机把你主动录下的对话转写成文字，用于回顾、摘要和待办。
        NSRemindersFullAccessUsageDescription: 在你逐条确认后，把待办写入「提醒事项」。
        NSCalendarsWriteOnlyAccessUsageDescription: 在你逐条确认后，把带日期的待办写入日历。
        NSFaceIDUsageDescription: 用面容 ID 保护你的对话记录。
        UIAppFonts: [InkSerif.otf]
    settings:
      base:
        PRODUCT_NAME: ${APP_NAME}
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  WatchApp:
    type: application
    platform: watchOS
    sources:
      - path: Watch/Sources
      - path: Watch/Resources
      - path: Shared
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: ${DISPLAY_NAME}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: ${BUNDLE_ID}
        # 公开的后台音频模式：前台由用户开始录音后，转入后台仍可继续，系统会显示麦克风指示
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: 只有在你点「开始录音」后才会录音，录音期间手表会显示系统麦克风指示。
    settings:
      base:
        PRODUCT_NAME: ${APP_NAME}Watch
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
schemes:
  App:
    build:
      targets:
        App: all
    archive:
      config: Release
