name: Build & upload to TestFlight

# 仓库里每个 App 一个目录：apps/<name>/{app.env,project.yml,App/}
# push 时只构建改动过的 App；改了 fastlane/ 或 workflow 则全部构建；手动触发可指定 app。
on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:
    inputs:
      app:
        description: "要构建的 App 目录名（apps/ 下），留空=全部"
        required: false
        default: ""

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: detect
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_APP: ${{ inputs.app }}
        run: |
          all=$(ls -d apps/*/ | xargs -n1 basename)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_APP" ]; then list="$INPUT_APP"; else list="$all"; fi
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            list="$all"
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            if echo "$changed" | grep -qE '^(fastlane/|Gemfile|\.github/)'; then
              list="$all"
            else
              list=$(echo "$changed" | grep -E '^apps/[^/]+/' | cut -d/ -f2 | sort -u)
            fi
          fi
          json=$(printf '%s\n' $list | python3 -c 'import sys,json,os; print(json.dumps([l.strip() for l in sys.stdin if l.strip() and os.path.isdir("apps/"+l.strip()) and "SKIP_CI=1" not in open("apps/"+l.strip()+"/app.env").read()]))')
          echo "apps=$json"
          echo "apps=$json" >> "$GITHUB_OUTPUT"

  testflight:
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}
    # Xcode 27.1 SDK 才能让 App 在 iPhone Duo 内屏铺满全屏（旧 SDK 会以兼容尺寸显示）
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      APP_DIR: apps/${{ matrix.app }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5

      - name: Load app.env
        run: grep -E '^[A-Z_]+=' "$APP_DIR/app.env" >> "$GITHUB_ENV"

      - name: Check secrets
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=()
          for k in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!k}" ] || missing+=("$k")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::缺少 GitHub Secrets: ${missing[*]}（见 SETUP.md）"; exit 1
          fi

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          key="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_KEY_P8" > "$key"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key"
          fi
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          if [ -d /Applications/Xcode_27.1.app ]; then sudo xcode-select -s /Applications/Xcode_27.1.app; fi
          xcodebuild -version

      - name: Ensure watchOS SDK (apps with a Watch target)
        run: |
          if [ -d "$APP_DIR/Watch" ] && ! xcodebuild -showsdks | grep -q watchos; then
            xcodebuild -downloadPlatform watchOS
          fi

      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd "$APP_DIR" && xcodegen generate

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build & upload
        run: bundle exec fastlane beta

      - name: Summary
        if: success()
        run: |
          {
            echo "### ✅ ${DISPLAY_NAME} 已上传 TestFlight"
            echo "- Bundle: ${BUNDLE_ID}"
            echo "- Version: ${MARKETING_VERSION} (${BUILD_NUMBER})"
            echo "- Commit: ${GITHUB_SHA::7}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs-${{ matrix.app }}
          path: |
            ${{ env.APP_DIR }}/build/**/*.log
            ~/Library/Logs/gym/
          if-no-files-found: ignore

  # 界面自查：有 preview.sh 的 App 会在模拟器里用演示数据截图，推到 ci-screenshots 分支供 Claude 查看。
  preview:
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      APP_DIR: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - name: Screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$APP_DIR/preview.sh" ] || { echo "no preview.sh"; exit 0; }
          while IFS='=' read -r k v; do export "$k=$v"; done < <(grep -E '^[A-Z_]+=' "$APP_DIR/app.env")
          export APPLE_TEAM_ID="""
          if [ -d /Applications/Xcode_27.1.app ]; then sudo xcode-select -s /Applications/Xcode_27.1.app; fi
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          OUT="$RUNNER_TEMP/shots/${{ matrix.app }}"
          bash "$APP_DIR/preview.sh" "$OUT"
          cd "$RUNNER_TEMP/shots"
          git init -q -b ci-screenshots
          git config user.name ci; git config user.email ci@users.noreply.github.com
          echo "$GITHUB_SHA" > COMMIT
          git add -A && git commit -qm "screenshots for $GITHUB_SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
