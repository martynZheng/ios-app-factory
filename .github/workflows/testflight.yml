name: Build & upload to TestFlight

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    # Xcode 27.1 SDK 才能让 App 在 iPhone Duo 内屏铺满全屏（旧 SDK 会以兼容尺寸显示）
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5

      - name: Load app.env
        run: grep -E '^[A-Z_]+=' app.env >> "$GITHUB_ENV"

      - name: Check secrets
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=()
          for k in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!k}" ] || missing+=("$k")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::缺少 GitHub Secrets: ${missing[*]}（见 SETUP.md）"; exit 1
          fi

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          key="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          # 兼容两种填法：直接粘贴 .p8 原文，或其 base64
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_KEY_P8" > "$key"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key"
          fi
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          if [ -d /Applications/Xcode_27.1.app ]; then sudo xcode-select -s /Applications/Xcode_27.1.app; fi
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build & upload
        run: bundle exec fastlane beta

      - name: Summary
        if: success()
        run: |
          {
            echo "### ✅ 已上传 TestFlight"
            echo "- App: ${DISPLAY_NAME} (${BUNDLE_ID})"
            echo "- Version: ${MARKETING_VERSION} (${BUILD_NUMBER})"
            echo "- Commit: ${GITHUB_SHA::7}"
            echo "苹果处理约 5–15 分钟后，TestFlight 会推送更新。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: |
            build/**/*.log
            ~/Library/Logs/gym/
            fastlane/report.xml
          if-no-files-found: ignore
